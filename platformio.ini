; PlatformIO configuration - Hollygrove Community Fridge door counter
; https://platformio.org/
;
; Environments (pick one with -e):
;   esp32s3      WiFi uplink. Runs on every ESP32-S3 board the project owns
;                (DevKitC-1 style N16R8, Freenove ESP32-S3 WROOM N8R8). DEFAULT.
;   esp32s3_dev  Same, but sends plain HTTP to a test receiver on the LAN
;                (bench testing only; see docs/firmware.md).
;   walter       LTE-M uplink for the DPTechnics/QuickSpot Walter board.
;   native       Unit tests of the hardware-independent logic on the PC
;                (needs a host C++ compiler, which this PC does not have;
;                 the same tests run on the board with: pio test -e esp32s3).
;
; Switching uplink = switching environment. Nothing else changes.

[platformio]
; Shorter build path to avoid Windows path length issues with deeply nested frameworks
build_dir = .b
default_envs = esp32s3

; ----------------------------------------------------------------------------
; Settings shared by all firmware environments
; ----------------------------------------------------------------------------
[common]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_deps =
    paulstoffregen/OneWire@2.3.8
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DUNITY_INCLUDE_DOUBLE

; ----------------------------------------------------------------------------
; ESP32-S3 over WiFi
;
; Board definition: esp32-s3-devkitc-1 (generic ESP32-S3-WROOM-1 dev board).
; The image is deliberately built for an 8 MB flash layout so that the SAME
; firmware runs on 8 MB (N8R8) and 16 MB (N16R8) modules. PSRAM is not used.
; ----------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = ${common.monitor_speed}
; The board's "UART" / "COM" USB-C port (CH343 chip). Check the number with:
;   pio device list
monitor_port = COM8
upload_port = COM8
; 921600 and 460800 gave corrupted transfers on this board's USB-serial chip.
upload_speed = 230400
test_port = COM8
test_speed = 115200
test_filter = test_core
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DUPLINK_WIFI

[env:esp32s3_dev]
extends = env:esp32s3
; Set the receiver address before building, e.g. in PowerShell:
;   $env:FRIDGE_DEV_HOST = "192.168.1.50"
build_flags =
    ${env:esp32s3.build_flags}
    -DDEV_HTTP_HOST=\"${sysenv.FRIDGE_DEV_HOST}\"
    -DDEV_HTTP_PORT=8080

; ----------------------------------------------------------------------------
; Walter (DPTechnics / QuickSpot): ESP32-S3-WROOM-1 N16R2 + Sequans GM02SP
; LTE-M modem. The official WalterModem library needs Arduino core 3.x,
; which PlatformIO's own espressif32 platform does not offer, so this
; environment uses the community "pioarduino" platform (pinned release).
; ALWAYS build it with a separate PlatformIO folder, or it overwrites the
; packages the esp32s3 environment needs (PowerShell):
;   $env:PLATFORMIO_CORE_DIR = "C:\Users\micha\.platformio-walter"
;   pio run -e walter
; Upload through Walter's USB-C port (native USB; the port number differs
; from the DevKitC's COM8: check with  pio device list).
; ----------------------------------------------------------------------------
[env:walter]
; 54.03.21 = Arduino core 3.2.1. (Release 55.x needs PlatformIO Core 6.2+,
; newer than the 6.1.19 installed here.)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; The platform's own esptool (5.0.0-dev1) crashes with the Click 8.3 library
; in PlatformIO's Python; 5.1.0 supports it.
platform_packages =
    tool-esptoolpy @ https://github.com/pioarduino/esptool/releases/download/v5.1.0/esptool.zip
board = esp32-s3-devkitc-1
board_build.variant = walter
framework = ${common.framework}
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = ${common.monitor_speed}
build_unflags = ${common.build_unflags}
lib_deps =
    ${common.lib_deps}
    quickspot/WalterModem@1.6.1
build_flags =
    ${common.build_flags}
    -DUPLINK_WALTER
    -DARDUINO_USB_CDC_ON_BOOT=1

; ----------------------------------------------------------------------------
; Unit tests on the PC (pure logic in lib/fridge_core only)
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_filter = test_core
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
lib_compat_mode = off
