; PlatformIO Configuration for Fridge Door Counter
; Supports both Pico 2W and ESP32-S3
; https://platformio.org/

[platformio]
; Shorter build path to avoid Windows path length issues with deeply nested frameworks
build_dir = .b

; ============================================================================
; Raspberry Pi Pico 2W
; ============================================================================
[env:pico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    -DUSE_PICO2W

; ============================================================================
; Freenove ESP32-S3 WROOM (N8R8: 8MB Flash, 8MB PSRAM)
; ============================================================================
[env:esp32s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_port = COM9
upload_port = COM9
upload_speed = 921600
build_flags =
    -DUSE_ESP32S3
